<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <defs>
  <filter id="inner-glow">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
    <feComposite in="blur" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
    <feFlood flood-color="hsl(204, 100%, 60%)" flood-opacity="0.5" result="flood"/>
    <feComposite in="flood" in2="shadowDiff" operator="in" result="shadow"/>
    <feComposite in="shadow" in2="SourceGraphic" operator="over"/>
  </filter>
  </defs>
  <path d="M 60 150 L 150 150 A 150 150 0 0 0 130.8923 76.7387 L 52.9326 121.7487 A 60 60 0 0 1 60 150 Z" fill="hsl(204, 100%, 20%)" stroke="none" filter="url(#inner-glow)"/>
</svg>
